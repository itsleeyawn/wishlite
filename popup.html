<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Aesthetic: design variation 2a — "Atelier masonry". Warm cream paper,
         serif wordmark, image-only masonry tiles, categories bleeding under a fade. */
      :root {
        color-scheme: light dark;
        --bg: #f6f3ec;
        --bg-rgb: 246, 243, 236; /* for the fade gradient */
        --text: #1c1712;
        --text-rgb: 28, 23, 18; /* for subtle shadows */
        --muted: #8b8375;
        --muted-strong: #5f574c;
        --muted-faint: #a89f8f;
        --surface: #fdfcf9;
        --tile-bg: #eceae3;
        --border: #e2dccf;
        --border-dashed: #c9beaa;
        --img-outline: rgba(0, 0, 0, 0.1); /* pure black in light mode */
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17140f; /* warm near-black paper */
          --bg-rgb: 23, 20, 15;
          --text: #f0ebe0;
          --text-rgb: 240, 235, 224;
          --muted: #8a8172;
          --muted-strong: #b3a996;
          --muted-faint: #7d7565;
          --surface: #221e18;
          --tile-bg: #221e18;
          --border: #342f26;
          --border-dashed: #47402f;
          --img-outline: rgba(255, 255, 255, 0.1); /* pure white in dark mode */
        }
      }
      body {
        width: 340px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 16px 16px 12px;
      }
      h1 {
        margin: 0;
        font: 500 24px/1 "Newsreader", Georgia, "Times New Roman", serif;
        letter-spacing: 0.005em;
      }
      #add {
        display: flex;
        align-items: center;
        gap: 6px;
        border: none;
        background: transparent;
        color: var(--text);
        font: 600 12.5px "Helvetica Neue", Helvetica, Arial, sans-serif;
        cursor: pointer;
        padding: 0;
        transition-property: transform;
        transition-duration: 0.1s;
      }
      #add:active { transform: scale(0.96); }
      #add svg { width: 12px; height: 12px; }

      .actions { display: flex; align-items: center; gap: 13px; }
      /* Collapsible search pill (design 2a) */
      .search {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        box-sizing: border-box;
        padding: 0 6px 0 9px;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 999px;
        box-shadow: 0 2px 12px rgba(var(--text-rgb), 0.06);
        overflow: hidden;
        width: 34px;
        transition: width 0.18s ease;
      }
      .search.open { width: 308px; } /* full header content width (340 − 16 − 16) */
      /* clear the title and add button so the pill can span the whole row */
      header:has(.search.open) h1,
      header:has(.search.open) #add { display: none; }
      .search-btn {
        flex: none;
        background: transparent;
        border: none;
        color: var(--text);
        cursor: pointer;
        /* fill the pill height and widen the tap target (pill is 34px tall) */
        height: 34px;
        width: 34px;
        margin-left: -9px; /* reach the pill's left edge; pill has 9px left padding */
        padding: 0;
        display: grid;
        place-items: center;
        transition-property: transform;
        transition-duration: 0.1s;
      }
      .search-btn:active { transform: scale(0.96); }
      .search-btn svg { width: 16px; height: 16px; }
      @media (prefers-color-scheme: dark) {
        .search { background: var(--text); }        /* --text is cream in dark mode */
        .search-btn, #search-input { color: var(--bg); }  /* --bg is near-black in dark mode */
        .search-x { color: var(--muted); }
      }
      #search-input {
        flex: 1;
        min-width: 0;
        border: none;
        background: transparent;
        color: var(--text);
        font: 13px "Helvetica Neue", Helvetica, Arial, sans-serif;
        outline: none;
        padding: 0;
      }
      .search-x {
        flex: none;
        background: transparent;
        border: none;
        color: var(--muted-faint);
        cursor: pointer;
        /* fill the pill height and widen the tap target */
        height: 34px;
        width: 34px;
        margin-right: -6px; /* reach the pill's right edge; pill has 6px right padding */
        padding: 0;
        display: grid;
        place-items: center;
      }
      .search-x svg { width: 14px; height: 14px; }
      .search:not(.open) #search-input,
      .search:not(.open) .search-x { display: none; }

      .tabs-wrap { position: relative; padding: 0 0 12px 16px; }
      #tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
        padding-right: 56px;
      }
      #tabs::-webkit-scrollbar { display: none; }
      /* categories bleed under the right edge */
      .tabs-wrap::after {
        content: "";
        position: absolute;
        top: 0; right: 0; bottom: 12px;
        width: 52px;
        pointer-events: none;
        background: linear-gradient(90deg, rgba(var(--bg-rgb), 0) 0%, var(--bg) 72%);
      }
      .tab {
        flex: none;
        border: none;
        border-radius: 999px;
        padding: 6px 13px;
        font: 500 12px "Helvetica Neue", Helvetica, Arial, sans-serif;
        cursor: pointer;
        white-space: nowrap;
        background: transparent;
        color: var(--muted);
        transition-property: transform;
        transition-duration: 0.1s;
      }
      .tab:active { transform: scale(0.96); }
      .tab.on { background: var(--text); color: var(--bg); }
      .tab.drop { outline: 2px solid var(--text); outline-offset: 1px; }
      .tab.new { color: var(--muted); border: 1px dashed var(--border-dashed); padding: 5px 12px; }
      input.tab {
        width: 104px;
        box-sizing: border-box;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--text);
        outline: none;
      }
      .tab .x { margin-left: 6px; opacity: 0.55; }
      .tab .x:hover { opacity: 1; }

      #grid {
        columns: 2;
        column-gap: 10px;
        padding: 0 16px 16px;
      }
      .tile {
        position: relative;
        display: block;
        break-inside: avoid;
        margin-bottom: 10px;
        border-radius: 7px;
        overflow: hidden;
        background: var(--tile-bg);
        /* inset shadow respects border-radius; pure black (light) / pure white (dark) so image edges read clean, not tinted */
        box-shadow: inset 0 0 0 1px var(--img-outline);
        cursor: pointer;
        text-decoration: none;
        color: var(--text);
        transition-property: transform;
        transition-duration: 0.1s;
      }
      .tile:active { transform: scale(0.96); }
      .tile img { display: block; width: 100%; height: auto; }
      .tile .label {
        display: block;
        padding: 16px 12px;
        font-size: 12px;
        text-align: center;
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }
      .del {
        position: absolute;
        top: 7px;
        right: 7px;
        width: 23px;
        height: 23px;
        border-radius: 7px;
        background: rgba(var(--text-rgb), 0.7);
        color: var(--bg);
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }
      .del svg { width: 12px; height: 12px; }
      .tile:hover .del { display: flex; }
      #empty { padding: 28px 16px; text-align: center; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>Wishlite</h1>
      <div class="actions">
        <div class="search" id="search">
          <button id="search-toggle" class="search-btn" title="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <circle cx="11" cy="11" r="7" /><line x1="16.5" y1="16.5" x2="21" y2="21" />
            </svg>
          </button>
          <input id="search-input" placeholder="Search" />
          <button id="search-cancel" class="search-x" title="Cancel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
            <line x1="6" y1="6" x2="18" y2="18" /><line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
        </div>
        <button id="add">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" fill="none">
            <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
          </svg>Add page
        </button>
      </div>
    </header>
    <div class="tabs-wrap"><nav id="tabs"></nav></div>
    <div id="grid"></div>
    <p id="empty" hidden>Nothing here yet.</p>
    <script src="categorize.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
